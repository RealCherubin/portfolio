 thousands of holes; 24 are drawn here.</span></figcaption></figure><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 06</span><span class="iso-plate-corner" data-corner="title">Three-layer weave</span><span class="iso-plate-corner" data-corner="hint">Hover to scrub six picks</span><span class="iso-plate-corner" data-corner="readout" data-readout>pick 1 of 6 · face layer</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="Three-layer loom: arrow keys step pick by pick; hovering scrubs through six picks" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 600 370" role="img" aria-label="A three-layer rapier loom. Three warp beams feed olive face ends, white middle ends and cream body ends over their back rests into six heddle frames. For each pick the frames lift one layer's odd or even ends, and every layer above it, so a rapier can lay the weft into that layer alone; the reed beats it into the fell and the woven cloth is wound on the take-up roll."><path class="iso-halo" d="M39.1 159.6L39.1 158.3L39.6 157L40.6 155.9L42.1 154.8L159.2 85L161 84.1L163.1 83.4L165.5 82.9L168 82.7L170.6 82.7L173.1 83L175.4 83.5L177.5 84.2L556.3 243.2L558.1 244.1L559.5 245.1L560.5 246.3L560.9 247.6L560.9 264.5L560.9 265.8L560.4 267L559.4 268.2L557.9 269.2L440.8 339L439 339.9L436.9 340.6L434.5 341.1L432 341.3L429.4 341.3L426.9 341L424.6 340.5L422.5 339.8L43.7 180.9L41.9 180L40.5 178.9L39.5 177.7L39.1 176.5Z"/><g class="iso-solid"><path class="iso-fill" d="M160.2 117.5L160.5 116.2L161.4 115L162.8 113.9L164.7 113.1L166.9 112.4L169.3 112L171.8 111.9L174.4 112.1L176.7 112.5L178.9 113.2L180.6 114.2L181.9 115.3L182.7 116.5L182.9 117.7L182.9 120L182.6 121.3L181.7 122.5L180.3 123.5L178.4 124.4L176.2 125L173.8 125.4L171.3 125.5L168.7 125.4L166.3 124.9L164.2 124.2L162.5 123.3L161.2 122.2L160.4 121L160.2 119 vg class="iso-swatch" data-mark="face" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Face ends, olive</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Middle ends, bacterial-protection layer</span><span class="iso-key"><svg class="iso-swatch" data-mark="body" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Body ends, cream with green pinstripes</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Rapier</span></span><span class="iso-caption">Six picks make one round: face, middle and body, then the same with the other half of each layer's ends. To weave a lower layer, every layer above it is lifted clear, so each weft only ever crosses its own layer's ends and the three cloths come off the loom as one stacked fabric.</span></figcaption></figure><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 07</span><span class="iso-plate-corner" data-corner="title">Cut, stitch &amp; fold</span><span class="iso-plate-corner" data-corner="hint">Hover to scrub the cycle</span><span class="iso-plate-corner" data-corner="readout" data-readout>hemming</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="Finishing bench: arrow keys step through feed, cut, hem, fold and label; hovering scrubs the cycle" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 600 370" role="img" aria-label="A finishing bench for aloe viscose towels. Woven three-layer cloth comes off a roll under a nip roller; a rotary blade on a gantry cuts one towel length off the web; the panel passes under a lockstitch head that sews }
